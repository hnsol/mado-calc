<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mado-calc テスト実行</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .test-results {
            margin-top: 30px;
        }

        .test-group {
            margin-bottom: 30px;
        }

        .group-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .test-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-item.pass {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .test-item.fail {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .test-icon {
            font-weight: bold;
            font-size: 16px;
        }

        .summary {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .summary-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .summary-stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .summary-stat.total {
            font-weight: bold;
            color: #333;
        }

        .summary-stat.pass {
            color: #28a745;
            font-weight: bold;
        }

        .summary-stat.fail {
            color: #dc3545;
            font-weight: bold;
        }

        .final-message {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
        }

        .final-message.success {
            background: #d4edda;
            color: #155724;
        }

        .final-message.failure {
            background: #f8d7da;
            color: #721c24;
        }

        .error-message {
            margin-top: 5px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 mado-calc テスト実行</h1>
        <p class="subtitle">計算ロジックとバリデーション機能のテスト</p>

        <div id="test-output" class="test-results">
            <p style="color: #666;">テスト実行中...</p>
        </div>
    </div>

    <!-- テスト用の隠し要素（DOM 初期化テストで使用） -->
    <div id="hidden-forms" style="display: none;">
        <select id="flavor">
            <option value="cheese" selected>チーズ</option>
            <option value="onion">玉ねぎ</option>
            <option value="maitake">舞茸</option>
        </select>
        <input type="number" id="cans" value="20">
        <input type="number" id="remainingDough" value="0.0">
        <div id="results" style="display: none;">
            <div id="warningMessage" style="display: none;"></div>
            <div id="materialsSection">
                <div id="materialsDetail"></div>
                <div id="totalMaterials"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // テストフレームワーク（ブラウザ版）
        let testCount = 0;
        let passCount = 0;
        let failCount = 0;
        const testResults = {};

        function test(groupName, description, fn) {
            testCount++;
            if (!testResults[groupName]) {
                testResults[groupName] = [];
            }

            try {
                fn();
                passCount++;
                testResults[groupName].push({ description, passed: true });
            } catch (error) {
                failCount++;
                testResults[groupName].push({
                    description,
                    passed: false,
                    error: error.message
                });
            }
        }

        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }

        function assertStrictEqual(actual, expected) {
            if (actual !== expected) {
                throw new Error(`Expected ${expected}, got ${actual}`);
            }
        }

        function closeToNumber(actual, expected, tolerance = 1e-6) {
            return Math.abs(actual - expected) < tolerance;
        }

        function assertClose(actual, expected, message) {
            if (!closeToNumber(actual, expected)) {
                throw new Error(message || `Expected ~${expected}, got ${actual}`);
            }
        }

        // 期待される必要グラム数（materials_i × cans/baseCans + reserveMaterials_i）を算出するヘルパー
        function expectedRequiredGrams(flavorId, cans) {
            const flavor = flavorData[flavorId];
            const requiredGrams = {};
            let requiredTotalGrams = 0;
            for (const [materialName, baseGrams] of Object.entries(flavor.materials)) {
                const reserveGrams = flavor.reserveMaterials[materialName] || 0;
                const grams = (baseGrams * cans) / flavor.baseCans + reserveGrams;
                requiredGrams[materialName] = grams;
                requiredTotalGrams += grams;
            }
            return { requiredGrams, requiredTotalGrams };
        }

        // ========== テストの実行 ==========

        // グループ: ゴールデンテスト（移行等価性・余り0）
        test('ゴールデンテスト', 'チーズ・20缶・余り0gの各素材グラム数が期待値と一致', () => {
            const result = calculateResults('cheese', 20, 0);
            const expected = {
                '米粉': 515.625,
                '砂糖（白）': 191.625,
                '太白ごま油': 203.125,
                '卵': 130.25,
                '片栗粉': 95.875,
                '塩': 19.125,
                'カシューチーズ': 250
            };
            for (const [materialName, expectedGrams] of Object.entries(expected)) {
                assertClose(result.materialsGrams[materialName], expectedGrams,
                    `${materialName}: expected ${expectedGrams}, got ${result.materialsGrams[materialName]}`);
            }
            assertClose(result.totalAdditionalGrams, 1405.625);
        });

        test('ゴールデンテスト', 'チーズ・40缶・余り0gの各素材グラム数が materials_i + reserveMaterials_i と一致', () => {
            const result = calculateResults('cheese', 40, 0);
            const flavor = flavorData.cheese;
            for (const [materialName, baseGrams] of Object.entries(flavor.materials)) {
                const expectedGrams = baseGrams + flavor.reserveMaterials[materialName];
                assertClose(result.materialsGrams[materialName], expectedGrams,
                    `${materialName}: expected ${expectedGrams}, got ${result.materialsGrams[materialName]}`);
            }
            assertClose(result.totalAdditionalGrams, 2530.125);
        });

        ['cheese', 'onion', 'maitake', 'sansho', 'miso'].forEach((flavorId) => {
            [40, 20, 7].forEach((cans) => {
                test('ゴールデンテスト', `${flavorId}・${cans}缶・余り0gの計算が期待式と一致`, () => {
                    const result = calculateResults(flavorId, cans, 0);
                    const { requiredGrams, requiredTotalGrams } = expectedRequiredGrams(flavorId, cans);
                    for (const [materialName, expectedGrams] of Object.entries(requiredGrams)) {
                        assertClose(result.materialsGrams[materialName], expectedGrams,
                            `${flavorId}/${cans}缶/${materialName}: expected ${expectedGrams}, got ${result.materialsGrams[materialName]}`);
                    }
                    assertClose(result.totalAdditionalGrams, requiredTotalGrams);
                });
            });
        });

        // グループ: 余り差し引き（比率按分）
        test('余り差し引き', '追加合計gは必要合計gから余りgを引いた値になる', () => {
            const { requiredTotalGrams } = expectedRequiredGrams('cheese', 20);
            const remainingGrams = 100;
            const result = calculateResults('cheese', 20, remainingGrams);
            assertClose(result.totalAdditionalGrams, requiredTotalGrams - remainingGrams);
        });

        test('余り差し引き', '各素材が比率按分され、合計が totalAdditionalGrams に一致', () => {
            const result = calculateResults('onion', 15, 200);
            const { requiredGrams, requiredTotalGrams } = expectedRequiredGrams('onion', 15);
            for (const [materialName, grams] of Object.entries(requiredGrams)) {
                const expectedGrams = result.totalAdditionalGrams * (grams / requiredTotalGrams);
                assertClose(result.materialsGrams[materialName], expectedGrams);
            }
            const sum = Object.values(result.materialsGrams).reduce((s, g) => s + g, 0);
            assertClose(sum, result.totalAdditionalGrams);
        });

        // グループ: calculateMaterials
        test('calculateMaterials', 'チーズの素材が7種類返される', () => {
            const { materialsGrams } = calculateMaterials('cheese', 20, 0);
            assertStrictEqual(Object.keys(materialsGrams).length, 7);
        });

        test('calculateMaterials', '玉ねぎの素材が8種類返される', () => {
            const { materialsGrams } = calculateMaterials('onion', 20, 0);
            assertStrictEqual(Object.keys(materialsGrams).length, 8);
        });

        test('calculateMaterials', 'チーズと玉ねぎで異なる素材が含まれる', () => {
            const { materialsGrams: cheeseMaterials } = calculateMaterials('cheese', 20, 0);
            const { materialsGrams: onionMaterials } = calculateMaterials('onion', 20, 0);
            assert(cheeseMaterials['カシューチーズ'] > 0);
            assert(!onionMaterials['カシューチーズ']);
            assert(onionMaterials['玉ねぎパウダー'] > 0);
            assert(!cheeseMaterials['玉ねぎパウダー']);
        });

        test('calculateMaterials', '素材の合計グラム数が totalAdditionalGrams と一致', () => {
            const { materialsGrams, totalAdditionalGrams } = calculateMaterials('cheese', 20, 0);
            const sum = Object.values(materialsGrams).reduce((s, g) => s + g, 0);
            assertClose(sum, totalAdditionalGrams);
        });

        // グループ: validateInputs
        test('validateInputs', 'フレーバー未選択は失敗', () => {
            const result = validateInputs('', 20, 0);
            assertStrictEqual(result.valid, false);
        });

        test('validateInputs', '無効なフレーバーIDは失敗', () => {
            const result = validateInputs('unknown', 20, 0);
            assertStrictEqual(result.valid, false);
        });

        test('validateInputs', '缶数0は失敗', () => {
            const result = validateInputs('cheese', 0, 0);
            assertStrictEqual(result.valid, false);
        });

        test('validateInputs', '余り生地が負の値は失敗', () => {
            const result = validateInputs('cheese', 20, -10);
            assertStrictEqual(result.valid, false);
        });

        test('validateInputs', '正常な入力は成功', () => {
            const result = validateInputs('cheese', 20, 100);
            assertStrictEqual(result.valid, true);
        });

        // グループ: calculateResults
        test('calculateResults', 'チーズ・20缶・余り0gの統合計算', () => {
            const result = calculateResults('cheese', 20, 0);
            assertStrictEqual(result.flavorId, 'cheese');
            assertStrictEqual(result.flavorName, '🧀 チーズ');
            assertStrictEqual(result.cans, 20);
        });

        test('calculateResults', '統合計算の結果オブジェクトが必要なキーを持つ', () => {
            const result = calculateResults('cheese', 20, 0);
            const requiredKeys = ['flavorId', 'flavorName', 'cans', 'remainingGrams',
                                 'requiredTotalGrams', 'totalAdditionalGrams', 'materialsGrams'];
            requiredKeys.forEach(key => {
                assert(key in result, `Missing key: ${key}`);
            });
        });

        test('calculateResults', 'チーズと玉ねぎで異なる結果が得られる', () => {
            const cheesResult = calculateResults('cheese', 20, 100);
            const onionResult = calculateResults('onion', 20, 100);
            assert(cheesResult.totalAdditionalGrams !== onionResult.totalAdditionalGrams,
                   'Total grams should differ');
        });

        // グループ: 警告メッセージケース
        test('警告メッセージ', '缶数が少なく余り生地が多い場合、追加合計gがマイナスになる', () => {
            const result = calculateResults('cheese', 1, 1000);
            assert(result.totalAdditionalGrams <= 0,
                   `totalAdditionalGrams should be <= 0, got ${result.totalAdditionalGrams}`);
        });

        test('警告メッセージ', '余り生地だけで足りる場合、追加合計gが0以下になる', () => {
            const { requiredTotalGrams } = expectedRequiredGrams('cheese', 1);
            const result = calculateResults('cheese', 1, requiredTotalGrams + 10);
            assert(result.totalAdditionalGrams <= 0,
                   '余り生地が十分にあれば、追加合計gは0以下になる');
        });

        test('警告メッセージ', '玉ねぎでも余り生地が多い場合、追加合計gがマイナスになる', () => {
            const result = calculateResults('onion', 1, 1000);
            assert(result.totalAdditionalGrams <= 0,
                   'Onion should also have negative totalAdditionalGrams with large remaining dough');
        });

        test('警告メッセージ', '缶数が多い場合は追加合計gが正になる', () => {
            // 缶数を多くすれば、余り生地の影響を上回る
            const result = calculateResults('cheese', 50, 100);
            assert(result.totalAdditionalGrams > 0,
                   '缶数が多いと追加合計gは常に正になる');
        });

        // グループ: DOM 初期化（Safari 対応）
        test('DOM 初期化', 'select 要素が存在する', () => {
            const flavorSelect = document.getElementById('flavor');
            assert(flavorSelect, 'select 要素が見つかりません');
        });

        test('DOM 初期化', 'select の初期値が cheese に設定されている', () => {
            const flavorSelect = document.getElementById('flavor');
            assertStrictEqual(flavorSelect.value, 'cheese', 'デフォルト値は cheese であるべき');
        });

        test('DOM 初期化', 'flavorData.cheese に color プロパティが存在する', () => {
            assert(flavorData.cheese.color, 'cheese に color プロパティがありません');
            assertStrictEqual(flavorData.cheese.color, 'yellow');
        });

        test('DOM 初期化', 'flavorData.onion に color プロパティが存在する', () => {
            assert(flavorData.onion.color, 'onion に color プロパティがありません');
            assertStrictEqual(flavorData.onion.color, 'orange');
        });

        test('DOM 初期化', 'flavorData.maitake に color プロパティが存在する', () => {
            assert(flavorData.maitake, 'maitake フレーバーが見つかりません');
            assert(flavorData.maitake.color, 'maitake に color プロパティがありません');
            assertStrictEqual(flavorData.maitake.color, 'gray');
        });

        test('DOM 初期化', 'colorMap が定義されている', () => {
            assert(typeof colorMap !== 'undefined', 'colorMap が定義されていません');
            assert(typeof colorMap === 'object', 'colorMap はオブジェクトであるべき');
        });

        test('DOM 初期化', 'colorMap に必要な色がすべて含まれている', () => {
            assert(colorMap.yellow, 'colorMap に yellow がありません');
            assert(colorMap.brown, 'colorMap に brown がありません');
            assert(colorMap.gray, 'colorMap に gray がありません');
            assertStrictEqual(colorMap.yellow, '#df8e1d');
            assertStrictEqual(colorMap.brown, '#d65d0b');
            assertStrictEqual(colorMap.gray, '#6c7086');
        });

        test('DOM 初期化', '初期表示色が設定されている', () => {
            // CSS 変数は <html> 要素に直接設定されるため、確認が困難な場合がある
            // 代わりに、onFlavorChange が正しく実装されていることを確認
            assert(typeof onFlavorChange === 'function', 'onFlavorChange 関数が定義されていません');
            // colorMap が存在し、cheese フレーバーの色が取得可能か確認
            const cheeseColor = colorMap[flavorData.cheese.color];
            assert(cheeseColor === '#df8e1d', `Cheese color should be #df8e1d, got ${cheeseColor}`);
        });

        test('DOM 初期化', 'すべてのフレーバーオプションが HTML に存在する', () => {
            const flavorSelect = document.getElementById('flavor');
            const optionValues = Array.from(flavorSelect.options).map(opt => opt.value);
            assert(optionValues.includes('cheese'), 'cheese オプションがありません');
            assert(optionValues.includes('onion'), 'onion オプションがありません');
            assert(optionValues.includes('maitake'), 'maitake オプションがありません');
        });

        // グループ: 入力フィールド変更時の動作
        test('入力フィールド変更時の動作', 'clearResults 関数が存在する', () => {
            assert(typeof clearResults === 'function', 'clearResults 関数が定義されていません');
        });

        test('入力フィールド変更時の動作', '缶数フィールドが存在する', () => {
            const cansInput = document.getElementById('cans');
            assert(cansInput, 'cans 入力フィールドが見つかりません');
        });

        test('入力フィールド変更時の動作', '余り生地フィールドが存在する', () => {
            const remainingInput = document.getElementById('remainingDough');
            assert(remainingInput, 'remainingDough 入力フィールドが見つかりません');
        });

        test('入力フィールド変更時の動作', 'results 要素が存在する', () => {
            const results = document.getElementById('results');
            assert(results, 'results 要素が見つかりません');
        });

        test('入力フィールド変更時の動作', 'clearResults() が results を非表示にできる', () => {
            // results を一度表示させる
            const results = document.getElementById('results');
            results.style.display = 'block';
            assert(results.style.display === 'block', 'results を表示できませんでした');

            // clearResults() を直接呼び出す
            clearResults();

            // results が非表示になっているか確認
            assert(results.style.display === 'none',
                   `results は非表示であるべき、got: ${results.style.display}`);
        });

        test('入力フィールド変更時の動作', '入力フィールド変更でリスナーが登録されている（実動作は手動確認）', () => {
            // リスナー登録の確認：clearResults 関数が存在することを確認
            assert(typeof clearResults === 'function', 'clearResults 関数が定義されていません');

            // 実際の input/change イベント動作は、ブラウザで手動確認が必要
            // (test.html の dispatchEvent では実際の input イベントと異なる動作をするため)
            assert(true, 'input/change リスナーが登録されています（手動確認推奨）');
        });

        // グループ: 表示結果 DOM
        test('表示結果 DOM', 'displayResults() が材料行を 2 カラム構造で描画する', () => {
            const result = calculateResults('cheese', 20, 0);
            displayResults(result);

            const rows = document.querySelectorAll('#materialsDetail .materials-row');
            assertStrictEqual(rows.length, Object.keys(result.materialsGrams).length);

            const firstRow = rows[0];
            assert(firstRow.querySelector('.materials-name'), '材料名要素がありません');
            assert(firstRow.querySelector('.materials-value'), '数量要素がありません');
            assert(firstRow.querySelector('.materials-amount'), '数量の強調要素がありません');
            assert(firstRow.querySelector('.materials-unit'), '単位要素がありません');
            assertStrictEqual(firstRow.querySelector('.materials-unit').textContent, 'g');
        });

        test('表示結果 DOM', 'displayResults() が合計行を専用クラス付きで描画する', () => {
            const result = calculateResults('cheese', 20, 0);
            displayResults(result);

            const totalRow = document.querySelector('#totalMaterials .materials-row-total');
            assert(totalRow, '合計行が描画されていません');
            assertStrictEqual(totalRow.querySelector('.materials-name').textContent, '合計');
            assertStrictEqual(totalRow.querySelector('.materials-unit').textContent, 'g');
        });

        test('表示結果 DOM', '追加合計gが0以下のとき、材料リストが非表示になり警告が表示される', () => {
            const result = calculateResults('cheese', 1, 1000);
            displayResults(result);

            const materialsSection = document.getElementById('materialsSection');
            const warningMessage = document.getElementById('warningMessage');
            assertStrictEqual(materialsSection.style.display, 'none');
            assertStrictEqual(warningMessage.style.display, 'block');
        });

        // グループ: プリセットボタン動作
        test('プリセットボタン動作', 'setRemainingDough() が存在する', () => {
            assert(typeof setRemainingDough === 'function', 'setRemainingDough 関数が定義されていません');
        });

        test('プリセットボタン動作', 'setRemainingDough(100) で 100.0 が設定される', () => {
            const remainingInput = document.getElementById('remainingDough');
            setRemainingDough(100);
            assertStrictEqual(remainingInput.value, '100.0');
        });

        test('プリセットボタン動作', 'setRemainingDough(200) で 200.0 が設定される', () => {
            const remainingInput = document.getElementById('remainingDough');
            setRemainingDough(200);
            assertStrictEqual(remainingInput.value, '200.0');
        });

        test('プリセットボタン動作', 'setRemainingDough(300) で 300.0 が設定される', () => {
            const remainingInput = document.getElementById('remainingDough');
            setRemainingDough(300);
            assertStrictEqual(remainingInput.value, '300.0');
        });

        test('プリセットボタン動作', 'setRemainingDough(500) で 500.0 が設定される', () => {
            const remainingInput = document.getElementById('remainingDough');
            setRemainingDough(500);
            assertStrictEqual(remainingInput.value, '500.0');
        });

        test('プリセットボタン動作', 'setRemainingDough(123.456) は小数点1位までフォーマットされる', () => {
            const remainingInput = document.getElementById('remainingDough');
            setRemainingDough(123.456);
            assertStrictEqual(remainingInput.value, '123.5');
        });

        test('プリセットボタン動作', 'setRemainingDough(0) で 0.0 が設定される', () => {
            const remainingInput = document.getElementById('remainingDough');
            setRemainingDough(0);
            assertStrictEqual(remainingInput.value, '0.0');
        });

        // ========== テスト結果の表示 ==========
        function renderResults() {
            const output = document.getElementById('test-output');
            let html = '';

            // グループごとにテスト結果を表示
            for (const [groupName, results] of Object.entries(testResults)) {
                html += `<div class="test-group">`;
                html += `<div class="group-title">${groupName}</div>`;

                for (const result of results) {
                    const className = result.passed ? 'pass' : 'fail';
                    const icon = result.passed ? '✓' : '✗';
                    html += `<div class="test-item ${className}">`;
                    html += `<span class="test-icon">${icon}</span>`;
                    html += `<span>${result.description}`;
                    if (result.error) {
                        html += `<div class="error-message">エラー: ${result.error}</div>`;
                    }
                    html += `</span></div>`;
                }

                html += `</div>`;
            }

            // サマリー
            const successClass = failCount === 0 ? 'success' : 'failure';
            const message = failCount === 0 ? '🎉 全テストが成功しました！' : `❌ ${failCount}個のテストが失敗しました`;

            html += `
                <div class="summary">
                    <div class="summary-title">テスト結果サマリー</div>
                    <div class="summary-stat total">
                        <span>総テスト数</span>
                        <span>${testCount}</span>
                    </div>
                    <div class="summary-stat pass">
                        <span>成功</span>
                        <span>${passCount}</span>
                    </div>
                    <div class="summary-stat fail">
                        <span>失敗</span>
                        <span>${failCount}</span>
                    </div>
                    <div class="final-message ${successClass}">${message}</div>
                </div>
            `;

            output.innerHTML = html;
        }

        // テスト実行と結果表示
        window.addEventListener('load', renderResults);
    </script>
</body>
</html>
